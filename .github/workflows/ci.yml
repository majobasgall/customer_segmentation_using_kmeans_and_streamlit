name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run app headless and fail on any exception
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("customer_segmentator.py", default_timeout=60).run()
          if app.exception:
              raise SystemExit(f"App raised: {app.exception}")
          PY
        env:
          MPLBACKEND: Agg
